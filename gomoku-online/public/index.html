<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>五子棋網路對戰</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
    .wrap { max-width: 860px; margin: 24px auto; padding: 16px; }
    .top { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input, button { padding: 8px 10px; }
    #status { margin: 8px 0 14px; font-weight: 700; }
    canvas { background: #d7a96b; border: 2px solid #333; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>五子棋網路對戰（Gomoku）</h2>
    <div class="top">
      <input id="room" value="demo-room" />
      <button id="join">加入房間</button>
      <button id="reset">重置</button>
    </div>
    <div id="status">尚未連線</div>
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <script>
    const SIZE = 15;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    let ws;
    let roomId = 'demo-room';
    let side = 0;
    let turn = 1;
    let winner = 0;
    let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));

    function draw() {
      const pad = 30;
      const gap = (canvas.width - pad*2) / (SIZE - 1);
      ctx.clearRect(0,0,canvas.width,canvas.height);

      ctx.strokeStyle = '#333';
      for (let i=0; i<SIZE; i++) {
        const p = pad + i*gap;
        ctx.beginPath(); ctx.moveTo(p,pad); ctx.lineTo(p,canvas.height-pad); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pad,p); ctx.lineTo(canvas.width-pad,p); ctx.stroke();
      }

      for (let y=0; y<SIZE; y++) {
        for (let x=0; x<SIZE; x++) {
          const v = board[y][x];
          if (!v) continue;
          const cx = pad + x*gap;
          const cy = pad + y*gap;
          ctx.beginPath();
          ctx.arc(cx, cy, gap*0.38, 0, Math.PI*2);
          ctx.fillStyle = v === 1 ? '#111' : '#fff';
          ctx.fill();
          ctx.strokeStyle = '#111';
          ctx.stroke();
        }
      }

      let text = side ? `你是${side===1?'黑子':'白子'} | 輪到${turn===1?'黑子':'白子'}` : '觀戰模式';
      if (winner) text = `勝利：${winner===1?'黑子':'白子'}`;
      statusEl.textContent = text;
    }

    function connect() {
      ws?.close();
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => ws.send(JSON.stringify({ type:'join', roomId }));
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'joined') {
          side = msg.side; board = msg.board; turn = msg.turn; winner = msg.winner;
          draw();
        } else if (msg.type === 'state') {
          board = msg.board; turn = msg.turn; winner = msg.winner;
          draw();
        }
      };
      ws.onclose = () => statusEl.textContent = '連線中斷';
    }

    canvas.addEventListener('click', (e) => {
      if (!ws || ws.readyState !== 1 || !side || winner || turn !== side) return;
      const rect = canvas.getBoundingClientRect();
      const x0 = e.clientX - rect.left;
      const y0 = e.clientY - rect.top;
      const pad = 30;
      const gap = (canvas.width - pad*2) / (SIZE - 1);
      const x = Math.round((x0 - pad) / gap);
      const y = Math.round((y0 - pad) / gap);
      ws.send(JSON.stringify({ type:'move', x, y }));
    });

    document.getElementById('join').onclick = () => {
      roomId = document.getElementById('room').value.trim() || 'demo-room';
      connect();
    };
    document.getElementById('reset').onclick = () => ws?.send(JSON.stringify({ type:'reset' }));

    draw();
  </script>
</body>
</html>
